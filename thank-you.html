<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Sparkye</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1d0622;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }
  .card {
    background: #250a2d;
    border: 1px solid rgba(245,168,0,0.2);
    border-radius: 8px;
    padding: 60px 48px;
    max-width: 520px;
    width: 100%;
  }
  .icon { font-size: 56px; margin-bottom: 24px; }
  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 52px;
    font-weight: 900;
    text-transform: uppercase;
    color: #F5A800;
    line-height: 1;
    margin-bottom: 16px;
  }
  p {
    font-size: 16px;
    font-weight: 300;
    color: rgba(255,255,255,0.65);
    line-height: 1.7;
    margin-bottom: 12px;
  }
  .phone {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    display: block;
    margin: 24px 0;
  }
  .btn {
    display: inline-block;
    background: #F5A800;
    color: #1d0622;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px 36px;
    border-radius: 2px;
    text-decoration: none;
    margin-top: 8px;
    transition: background 0.2s;
  }
  .btn:hover { background: #ffd200; }
  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 28px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>Thank You!</h1>
    <p>We've received your request and will get back to you within <strong style="color:#fff;">2 hours</strong>.</p>
    <p>For emergencies, call us directly:</p>
    <a href="tel:+15102604668" class="phone">📞 (510) 260-4668</a>
    <hr class="divider">
    <a href="/" class="btn">← Back to Home</a>
  </div>
</body>
</html>
